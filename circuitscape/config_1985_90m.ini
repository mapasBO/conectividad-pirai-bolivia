# Circuitscape 4.0 — Configuracion para 1985
# Subcuenca rio Grande-Pirai, Bolivia
# Modo: all-to-one | Resolucion: 90 m | Vecindad: 8 celdas
#
# Uso: Circuitscape -> File -> Load settings -> Ejecutar
# Tiempo estimado: < 5 minutos (5 nodos activos en 1985)
#
# Rutas relativas al directorio del proyecto (adaptar segun instalacion):
# BASE = C:/ruta/a/conectividad-pirai-bolivia/

[circuitscape options]
data_type = raster
scenario = all-to-one

[Habitat raster or graph]
habitat_file = ../data/rasters_90m/resistencia_1985_90m.asc
habitat_map_is_resistances = True

[Node/region file]
point_file = ../data/rasters_90m/nodos_1985_90m.asc

[Output options]
output_file = ../data/circuitscape/resultado_1985_90m
write_cur_maps = True
write_volt_maps = True
log_transform_maps = False
write_cum_cur_map_only = True

[Options for advanced mode]
connect_four_neighbors_only = False
use_unit_currents = False
use_direct_grounds = False
